<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="24-Tage-Kurs">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#07384a">
  <title>24-Tage-Persönlichkeitskurs</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="small-title">24 Tage Persönlichkeitskurs</div>
      <section class="day-line">
        <span id="dayNumber">1.</span>
        <span id="theme">Präsenz</span>
      </section>
    </header>
    <section class="section morning">
      <h1>Morgenaufgabe</h1>
      <div class="cyan-card"><p id="morningText"></p></div>
    </section>
    <section class="section evening">
      <h1>Abendreflexion</h1>
      <div class="reflection-box"><ul id="eveningList"></ul></div>
    </section>
    <nav class="nav">
      <button id="prev">Zurück</button>
      <span id="progress">Tag 1 von 24</span>
      <button id="next">Weiter</button>
    </nav>
    <details class="settings">
      <summary>Einstellungen</summary>
      <label>Startdatum <input id="startDate" type="date"></label>
      <button id="today">Heute anzeigen</button>
    </details>
  </main>
  <script src="course.js"></script>
  <script src="app.js"></script>
</body>
</html>
